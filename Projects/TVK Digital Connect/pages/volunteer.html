<!DOCTYPE html>
<html lang="ta">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volunteer Registration - TVK Digital Connect</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- Header Navigation -->
    <header class="app-page-header">
        <a href="../index.html?skipIntro=true" class="nav-btn">🏠 Home</a>
        <a href="../index.html?skipIntro=true" class="nav-btn">← Back</a>
    </header>

    <main class="page active-page sub-page-container">
        
        <div class="content-box">
            <h1>👥 தொண்டர் பதிவு</h1>
            <p>தமிழக வெற்றிக் கழகத்தில் களப்பணியாளராக இணைவதற்கு கீழே உள்ள படிவத்தைப் பூர்த்தி செய்யவும்.</p>

            <!-- Volunteer Form -->
            <form id="volunteerForm" style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
                
                <div>
                    <label for="fullName" style="font-size: 0.85rem; color: #f1c40f;">முழு பெயர் / Full Name</label>
                    <input type="text" id="fullName" required placeholder="உங்கள் பெயர்" 
                        style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); color: #fff; margin-top: 5px;">
                </div>

                <div>
                    <label for="phone" style="font-size: 0.85rem; color: #f1c40f;">கைபேசி எண் / Mobile Number</label>
                    <input type="tel" id="phone" required placeholder="9876543210" pattern="[0-9]{10}"
                        style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); color: #fff; margin-top: 5px;">
                </div>

                <div>
                    <label for="district" style="font-size: 0.85rem; color: #f1c40f;">மாவட்டம் / District</label>
                    <select id="district" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.7); color: #fff; margin-top: 5px;">
                        <option value="">மாவட்டம் தேர்ந்தெடுக்கவும்</option>
                        <option value="Chennai">சென்னை (Chennai)</option>
                        <option value="Madurai">மதுரை (Madurai)</option>
                        <option value="Coimbatore">கோயம்புத்தூர் (Coimbatore)</option>
                        <option value="Trichy">திருச்சி (Trichy)</option>
                        <option value="Salem">சேலம் (Salem)</option>
                        <option value="Tirunelveli">திருநெல்வேலி (Tirunelveli)</option>
                        <option value="Other">மற்றவை (Other)</option>
                    </select>
                </div>

                <div>
                    <label for="ward" style="font-size: 0.85rem; color: #f1c40f;">தொகுதி / வார்டு / Ward/Constituency</label>
                    <input type="text" id="ward" placeholder="எ.கா: வார்டு 12 / தொகுதி பெயர்"
                        style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5); color: #fff; margin-top: 5px;">
                </div>

                <div>
                    <label for="role" style="font-size: 0.85rem; color: #f1c40f;">விருப்பமான பணி / Preferred Role</label>
                    <select id="role" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.7); color: #fff; margin-top: 5px;">
                        <option value="Field Work">களப்பணி (Field Work)</option>
                        <option value="Social Media">சமூக வலைத்தளப் பணி (Social Media)</option>
                        <option value="Event Management">நிகழ்ச்சி ஒருங்கிணைப்பு (Event Org)</option>
                    </select>
                </div>

                <button type="submit" class="btn" style="margin-top: 10px; width: 100%;">சமர்ப்பி / Submit</button>
            </form>

            <a href="../index.html?skipIntro=true" style="display: inline-block; margin-top: 20px; color: #f1c40f; text-decoration: none; font-size: 0.9rem;">← முகப்புப் பக்கத்திற்குச் செல்ல</a>
        </div>

    </main>

    <script>
        document.getElementById('volunteerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newVolunteer = {
                name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                district: document.getElementById('district').value,
                ward: document.getElementById('ward').value,
                role: document.getElementById('role').value,
                date: new Date().toLocaleDateString('ta-IN')
            };

            let volunteers = JSON.parse(localStorage.getItem('tvk_volunteers')) || [];
            volunteers.push(newVolunteer);
            localStorage.setItem('tvk_volunteers', JSON.stringify(volunteers));

            alert('உங்கள் தொண்டர் பதிவு வெற்றிகரமாக சேமிக்கப்பட்டது!');
            this.reset();
        });
    </script>
</body>

</html>
