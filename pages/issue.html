<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Public Issue - TVK Digital Connect</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="app-page-header">
        <a href="../index.html?skipIntro=true" class="nav-btn">🏠 Home</a>
        <a href="../index.html?skipIntro=true" class="nav-btn">← Back</a>
    </header>

    <main class="page active-page sub-page-container">
        <div class="content-box" style="max-width: 600px; width: 95%;">
            <h1>📝 பொதுப் பிரச்சினைப் பதிவு</h1>

            <form id="issueForm" style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
                <input type="text" id="reporterName" required placeholder="உங்கள் பெயர்" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #444; border-radius: 4px;">
                <input type="tel" id="reporterPhone" required placeholder="கைபேசி எண்" pattern="[0-9]{10}" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #444; border-radius: 4px;">
                
                <select id="issueCategory" required style="width: 100%; padding: 10px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid #444; border-radius: 4px;">
                    <option value="">வகையைத் தேர்ந்தெடுக்கவும்</option>
                    <option value="Road">சாலை வசதி</option>
                    <option value="Water">குடிநீர் பிரச்சனை</option>
                    <option value="Electricity">மின்சாரம்</option>
                    <option value="Other">இதர பிரச்சினைகள்</option>
                </select>

                <input type="text" id="location" required placeholder="இடம் / Location" style="width: 100%; padding: 10px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #444; border-radius: 4px;">
                <textarea id="description" rows="4" required placeholder="பிரச்சினையின் விவரம்..." style="width: 100%; padding: 10px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #444; border-radius: 4px;"></textarea>

                <div>
                    <label style="color: #f1c40f; font-size: 0.85rem;">புகைப்படங்கள் (Optional):</label>
                    <input type="file" id="issueImages" accept="image/*" multiple style="width: 100%; color: #fff; margin-top: 5px;">
                </div>

                <button type="submit" id="submitBtn" class="btn" style="width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">புகாரைச் சமர்ப்பி</button>
            </form>
        </div>
    </main>

    <script>
        // 🚨 உங்கள் GitHub விவரங்களை இங்கே மாற்றவும்
        const GITHUB_USERNAME = "SKJeevaTVK";
        const GITHUB_REPO = "TVK-Digital-Connect";
        const GITHUB_TOKEN = "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"; 

        // Imgur API மூலம் படங்களை Upload செய்யும் செயல்பாடு
        async function uploadImageToImgur(file) {
            const formData = new FormData();
            formData.append('image', file);
            try {
                const response = await fetch('https://api.imgur.com/3/image', {
                    method: 'POST',
                    headers: { Authorization: 'Client-ID c982fae3f05b927' },
                    body: formData
                });
                const data = await response.json();
                return data.success ? data.data.link : null;
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        document.getElementById('issueForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "GitHub-ல் சேமிக்கப்படுகிறது...";
            submitBtn.disabled = true;

            const name = document.getElementById('reporterName').value.trim();
            const phone = document.getElementById('reporterPhone').value.trim();
            const category = document.getElementById('issueCategory').value;
            const location = document.getElementById('location').value.trim();
            const description = document.getElementById('description').value.trim();
            const files = document.getElementById('issueImages').files;

            try {
                let imagesHTML = "";
                if (files.length > 0) {
                    for (let i = 0; i < files.length; i++) {
                        const imgUrl = await uploadImageToImgur(files[i]);
                        if (imgUrl) {
                            imagesHTML += `<img src="${imgUrl}" width="250" style="margin:5px; border-radius:5px;"><br>`;
                        }
                    }
                }

                const refNumber = `TVK-${Math.floor(1000 + Math.random() * 9000)}`;
                const issueTitle = `[COMPLAINT] ${category} - ${location} (${refNumber})`;
                
                const issueBody = `### 📝 Complaint Details
* **Ref No:** \`${refNumber}\`
* **Name:** ${name}
* **Phone:** ${phone}
* **Category:** ${category}
* **Location:** ${location}

---
### 📄 Details:
${description}

---
### 🖼️ Attachments:
${imagesHTML || '_புகைப்படங்கள் இணைக்கப்படவில்லை_'}
`;

                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/issues`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: issueTitle,
                        body: issueBody,
                        labels: ['complaint', category]
                    })
                });

                if (response.ok) {
                    alert(`புகார் வெற்றிகரமாக GitHub-ல் சேமிக்கப்பட்டது!\nRef No: ${refNumber}`);
                    this.reset();
                } else {
                    alert("GitHub API பிழை! Username, Repo Name மற்றும் Token விவரங்களைச் சரிபார்க்கவும்.");
                }
            } catch (err) {
                console.error(err);
                alert("இணைய இணைப்பில் பிழை ஏற்பட்டது. மீண்டும் முயற்சிக்கவும்.");
            } finally {
                submitBtn.innerText = "புகாரைச் சமர்ப்பி";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
