<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - TVK Digital Connect</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="app-page-header">
        <a href="../index.html?skipIntro=true" class="nav-btn">🏠 Home</a>
    </header>

    <main class="page active-page sub-page-container">
        <div class="content-box" style="max-width: 800px; width: 95%;">
            <h1>👤 Admin Panel</h1>

            <!-- Login Form -->
            <div id="loginSection">
                <form id="adminLoginForm" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
                    <input type="text" id="username" required placeholder="Admin ID" style="padding: 10px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #444; border-radius: 4px;">
                    <input type="password" id="password" required placeholder="Password" style="padding: 10px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #444; border-radius: 4px;">
                    <button type="submit" class="btn" style="padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
                </form>
            </div>

            <!-- Complaints Dashboard -->
            <div id="adminDashboard" style="display: none; text-align: left;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px;">
                    <h2 style="color: #f1c40f; margin: 0;">GitHub Complaints</h2>
                    <button id="logoutBtn" style="padding: 6px 12px; background: #e74c3c; border: none; color: white; border-radius: 4px; cursor: pointer;">Logout</button>
                </div>

                <div id="issuesContainer" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                    <p style="color: #aaa;">GitHub-லிருந்து புகார்கள் பதிவேற்றப்படுகின்றன...</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 🚨 உங்கள் GitHub விவரங்களை இங்கே மாற்றவும்
        const GITHUB_USERNAME = "SKJeevaTVK";
        const GITHUB_REPO = "TVK-Digital-Connect";
        const GITHUB_TOKEN = "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";

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // கடவுச்சொல் மற்றும் ID
            if(document.getElementById('username').value === 'admin' && document.getElementById('password').value === 'admin123') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                fetchGitHubIssues();
            } else {
                alert('தவறான Admin ID அல்லது Password!');
            }
        });

        // GitHub-ல் இருந்து புகார்களை மட்டும் எடுத்து வருவது
        async function fetchGitHubIssues() {
            const container = document.getElementById('issuesContainer');
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/issues?state=all`, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                const issues = await response.json();
                container.innerHTML = '';

                if (!Array.isArray(issues) || issues.length === 0) {
                    container.innerHTML = '<p style="color: #aaa;">புகார்கள் எதுவும் இல்லை.</p>';
                    return;
                }

                issues.forEach(issue => {
                    const htmlBody = issue.body ? issue.body.replace(/\n/g, '<br>') : '';

                    container.innerHTML += `
                        <div style="background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; border: 1px solid #444;">
                            <h3 style="color: #f1c40f; margin-top: 0; margin-bottom: 8px;">${issue.title}</h3>
                            <span style="background: ${issue.state === 'open' ? '#e74c3c' : '#27ae60'}; color: #fff; padding: 3px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: bold;">
                                ${issue.state.toUpperCase()}
                            </span>

                            <!-- Read-Only Details -->
                            <div style="background: #111; color: #ddd; padding: 12px; border-radius: 5px; margin: 12px 0; max-height: 250px; overflow-y: auto; font-size: 0.85rem; border: 1px solid #333;">
                                ${htmlBody}
                            </div>

                            <!-- Reply and Status Update Buttons -->
                            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                                <input type="text" id="reply_${issue.number}" placeholder="பதிலை உள்ளிடவும்..." style="flex: 1; min-width: 180px; padding: 8px; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px;">
                                <button onclick="sendResponse(${issue.number})" style="background: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">Send Reply</button>
                                <button onclick="toggleStatus(${issue.number}, '${issue.state}')" style="background: #f39c12; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">
                                    ${issue.state === 'open' ? 'Close Issue' : 'Reopen'}
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = '<p style="color: #e74c3c;">GitHub தரவுகளைப் பெறுவதில் பிழை ஏற்பட்டது.</p>';
            }
        }

        // Admin பதில் அளிக்கும் செயல்பாடு
        async function sendResponse(issueNumber) {
            const replyInput = document.getElementById(`reply_${issueNumber}`);
            const replyText = replyInput.value.trim();
            if (!replyText) return alert("பதிலை உள்ளிடவும்!");

            const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/issues/${issueNumber}/comments`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ body: `**Admin Response:** ${replyText}` })
            });

            if (response.ok) {
                alert("பதில் வெற்றிகரமாக அனுப்பப்பட்டது!");
                replyInput.value = '';
                fetchGitHubIssues();
            } else {
                alert("பதில் அனுப்புவதில் பிழை ஏற்பட்டது.");
            }
        }

        // Status மாற்றுவது (Open / Closed)
        async function toggleStatus(issueNumber, currentState) {
            const newState = currentState === 'open' ? 'closed' : 'open';
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/issues/${issueNumber}`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ state: newState })
            });

            if (response.ok) {
                alert(`நிலை மாற்றப்பட்டது: ${newState.toUpperCase()}`);
                fetchGitHubIssues();
            }
        }

        document.getElementById('logoutBtn').onclick = () => location.reload();
    </script>
</body>
</html>
